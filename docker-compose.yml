services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vial_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vial} -d ${POSTGRES_DB:-vial_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # Perfil `prod`: imágenes Docker (VPS / stack completo). En desarrollo local
  # Next.js y el analyzer se ejecutan en el host (hot reload + breakpoints).
  analyzer:
    profiles: ["prod"]
    build:
      context: ./services/analyzer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      YOLO_WEIGHTS_PATH: ${YOLO_WEIGHTS_PATH:-/app/models/pothole_seg.pt}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://web:3000}
      WORKER_TMP_DIR: /tmp/vial-worker
    volumes:
      - analyzer_models:/app/models
      - uploads:/app/uploads
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1536m

  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANALYZER_URL: ${ANALYZER_URL:-http://analyzer:8000}
      IOT_DEVICE_TOKEN: ${IOT_DEVICE_TOKEN:-change_me_device_token}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      JOBS_DIR: ${JOBS_DIR:-/app/uploads/jobs}
      API_KEY_CURRENT: ${API_KEY_CURRENT:?set API_KEY_CURRENT in .env}
      API_KEY_PREVIOUS: ${API_KEY_PREVIOUS:-}
      UPLOAD_HMAC_SECRET: ${UPLOAD_HMAC_SECRET:?set UPLOAD_HMAC_SECRET in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8192}
      MIN_FREE_DISK_GB: ${MIN_FREE_DISK_GB:-20}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 512m

volumes:
  pgdata:
  uploads:
  analyzer_models:
