# Reverse proxy TLS para Next.js (único punto público): bachedron.javier.tech.
# En el mismo VPS, 3000 y 6071 pertenecen a otros sitios.
# Esta app usa 127.0.0.1:3010. El worker FastAPI no se publica: 127.0.0.1:8010.
# El certificado de javier.tech tiene que incluir el subdominio.

upstream next_web {
    server 127.0.0.1:3010;
}

server {
    listen 80;
    server_name bachedron.javier.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bachedron.javier.tech;

    ssl_certificate     /etc/letsencrypt/live/javier.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/javier.tech/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads 8K (GB): sin bufferizar el body hacia Node
    client_max_body_size 8192m;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://next_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
