name: Publish Web

on:
  workflow_call:
    inputs:
      deploy:
        description: Copy the standalone build to the VPS and restart the site
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish
        env:
          DATABASE_URL: postgresql://vial:build@127.0.0.1:5432/vial_monitor?schema=public
          NEXT_PUBLIC_APP_NAME: Monitoreo Vial con Drones
          NEXT_PUBLIC_MAX_UPLOAD_MB: "8192"
        run: |
          set -euo pipefail
          pnpm --filter web build
          standalone="apps/web/.next/standalone"
          mkdir -p "$standalone/apps/web/.next"
          cp -a apps/web/.next/static "$standalone/apps/web/.next/static"
          if [ -d apps/web/public ]; then
            cp -a apps/web/public "$standalone/apps/web/public"
          fi
          mkdir -p "$standalone/apps/web/prisma"
          cp -a apps/web/prisma/. "$standalone/apps/web/prisma/"
          # npm, no pnpm: el .pnpm que sube rsync llega incompleto
          # (fast-check sin ./data/GraphemeRanges).
          cli="$standalone/apps/web/prisma-cli"
          rm -rf "$cli"
          prisma_version="$(node --input-type=module -e "
            import { createRequire } from 'node:module';
            import path from 'node:path';
            const require = createRequire(path.resolve('apps/web/package.json'));
            process.stdout.write(require('prisma/package.json').version);
          ")"
          node --input-type=module -e "
            import fs from 'node:fs';
            const dest = process.argv[1];
            const version = process.argv[2];
            fs.mkdirSync(dest, { recursive: true });
            fs.writeFileSync(dest + '/package.json', JSON.stringify({
              name: 'prisma-cli',
              private: true,
              dependencies: { prisma: version },
            }, null, 2) + '\n');
          " "$cli" "$prisma_version"
          npm install --prefix "$cli" --omit=dev --no-audit --no-fund
          unit="$(find "$cli/node_modules" -path '*/fast-check/lib/arbitrary/_internals/StringUnitArbitrary.js' -print -quit)"
          test -n "$unit"
          test -f "$(dirname "$unit")/data/GraphemeRanges.js"
          node "$cli/node_modules/prisma/build/index.js" --version

      - name: Deploy to VPS
        if: inputs.deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$port" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "mkdir -p /var/www/javiermc/bachedron/web /var/www/javiermc/bachedron/data/jobs"
          rsync -az --delete \
            --no-times --omit-dir-times \
            --no-perms --no-owner --no-group \
            --filter 'protect uploads/' \
            --filter 'protect apps/web/uploads/' \
            --filter 'protect data/' \
            --exclude 'uploads/' \
            --exclude 'apps/web/uploads/' \
            --exclude 'data/' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -p $port -i ~/.ssh/id_ed25519" \
            apps/web/.next/standalone/ "$VPS_USER@$VPS_HOST:/var/www/javiermc/bachedron/web/"
          ssh -p "$port" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "bash -s" <<'EOF'
          set -euo pipefail
          # SSH no carga nvm. /usr/bin/node es el 18 del sistema; el 22 está aquí.
          NODE_BIN=/home/jmcdeploy/.nvm/versions/node/v22.23.4/bin/node
          if [ ! -x "$NODE_BIN" ]; then
            echo "No está Node 22 en $NODE_BIN" >&2
            exit 1
          fi
          if [ ! -f /var/www/javiermc/bachedron/web.env ]; then
            echo "Falta /var/www/javiermc/bachedron/web.env (DATABASE_URL, INTERNAL_TOKEN, claves de upload)." >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          . /var/www/javiermc/bachedron/web.env
          set +a
          cd /var/www/javiermc/bachedron/web/apps/web
          "$NODE_BIN" prisma-cli/node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma
          sudo -n /usr/bin/systemctl restart bachedron.javier.tech.service
          EOF
