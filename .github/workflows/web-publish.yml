name: Publish Web

on:
  workflow_call:
    inputs:
      deploy:
        description: Copy the standalone build to the VPS and restart the site
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish
        env:
          DATABASE_URL: postgresql://vial:build@127.0.0.1:5432/vial_monitor?schema=public
          NEXT_PUBLIC_APP_NAME: Monitoreo Vial con Drones
          NEXT_PUBLIC_MAX_UPLOAD_MB: "8192"
        run: |
          set -euo pipefail
          pnpm --filter web build
          standalone="apps/web/.next/standalone"
          mkdir -p "$standalone/apps/web/.next"
          cp -a apps/web/.next/static "$standalone/apps/web/.next/static"
          if [ -d apps/web/public ]; then
            cp -a apps/web/public "$standalone/apps/web/public"
          fi
          mkdir -p "$standalone/apps/web/prisma"
          cp -a apps/web/prisma/. "$standalone/apps/web/prisma/"
          # CLI de Prisma ya instalado en el runner. En el VPS solo existe
          # /usr/bin/node (igual que javiermc.tech); npx no está en el PATH de SSH.
          CLI_DEST="$standalone/apps/web/prisma-cli" node --input-type=module <<'JS'
          import { createRequire } from "node:module";
          import fs from "node:fs";
          import path from "node:path";

          const destRoot = process.env.CLI_DEST;
          const nodeModules = path.join(destRoot, "node_modules");
          fs.mkdirSync(nodeModules, { recursive: true });

          const fromWeb = createRequire(path.resolve("apps/web/package.json"));
          const seen = new Set();

          function copyPackage(packageJsonPath) {
            const realJson = fs.realpathSync(packageJsonPath);
            if (seen.has(realJson)) return;
            seen.add(realJson);
            const pkg = JSON.parse(fs.readFileSync(realJson, "utf8"));
            const destDir = path.join(nodeModules, pkg.name);
            fs.mkdirSync(path.dirname(destDir), { recursive: true });
            fs.cpSync(path.dirname(realJson), destDir, { recursive: true, dereference: true });
            const requireFromPackage = createRequire(realJson);
            const deps = [
              ...Object.keys(pkg.dependencies ?? {}),
              ...Object.keys(pkg.optionalDependencies ?? {}),
            ];
            for (const dep of deps) {
              try {
                copyPackage(requireFromPackage.resolve(`${dep}/package.json`));
              } catch (error) {
                console.warn(`prisma-cli: omito ${dep}: ${error.message}`);
              }
            }
          }

          copyPackage(fromWeb.resolve("prisma/package.json"));
          const entry = path.join(nodeModules, "prisma/build/index.js");
          if (!fs.existsSync(entry)) {
            throw new Error(`No está el CLI de Prisma en ${entry}`);
          }
          console.log(`prisma-cli listo en ${destRoot}`);
          JS

      - name: Deploy to VPS
        if: inputs.deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$port" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "mkdir -p /var/www/javiermc/bachedron/web /var/www/javiermc/bachedron/data/jobs"
          rsync -az --delete \
            --no-times --omit-dir-times \
            --no-perms --no-owner --no-group \
            --filter 'protect uploads/' \
            --filter 'protect apps/web/uploads/' \
            --filter 'protect data/' \
            --exclude 'uploads/' \
            --exclude 'apps/web/uploads/' \
            --exclude 'data/' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -p $port -i ~/.ssh/id_ed25519" \
            apps/web/.next/standalone/ "$VPS_USER@$VPS_HOST:/var/www/javiermc/bachedron/web/"
          ssh -p "$port" -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" "bash -s" <<'EOF'
          set -euo pipefail
          if [ ! -f /var/www/javiermc/bachedron/web.env ]; then
            echo "Falta /var/www/javiermc/bachedron/web.env (DATABASE_URL, INTERNAL_TOKEN, claves de upload)." >&2
            exit 1
          fi
          set -a
          # shellcheck disable=SC1091
          . /var/www/javiermc/bachedron/web.env
          set +a
          cd /var/www/javiermc/bachedron/web/apps/web
          /usr/bin/node prisma-cli/node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma
          sudo -n /usr/bin/systemctl restart bachedron.javier.tech.service
          EOF
